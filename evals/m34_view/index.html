<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3 / M4 探索记忆</title><link rel="stylesheet" href="../style.css"><style>table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:6px;border-bottom:1px solid #dae2dd}#log{max-height:320px;overflow:auto}#log p{border-bottom:1px solid #dae2dd;overflow-wrap:anywhere}#stats{background:#edf4f0;padding:10px}summary{cursor:pointer;font-weight:bold}input[type=search]{width:100%;padding:7px}</style><main><header><div><small>MP3D · M3 / M4</small><h1>探索记忆回放</h1></div><a href="../">查看 M2 物体记忆</a></header><section class="toolbar"><button id="prev">上一帧</button><button id="next">下一帧</button><input id="slider" aria-label="选择帧" type="range" value="0" min="0"><b id="frame">读取中</b></section><div class="columns"><section><h2>探索区域 <select id="sel" aria-label="选择区域"></select></h2><svg id="map" viewBox="0 0 480 360" style="width:100%"></svg><p>蓝点为机器人，圆点为 Frontier，三角为计划观察点。选中区域内，绿色格已观测，橙色格待观测。</p><div id="stats"></div></section><section><h2>原始相机画面 <span id="scene"></span></h2><img id="rgb" style="width:100%" alt="当前帧 MP3D 相机画面"></section></div><div class="columns"><section><h2>区域完成判据</h2><div id="metrics"></div><p>覆盖率使用量程和已知遮挡筛出的可观测格。当前适配器为每个新边界固定一片局部区域，沿未知侧扩展 0.40 m；覆盖率描述该局部区域。</p></section><section><h2>M4 事件时间线 <a href="events.jsonl" download>JSONL</a></h2><input id="q" type="search" placeholder="按物体 ID、Frontier ID 或事件类型过滤"><label><input type="checkbox" id="past">包含此前所有帧</label><div id="log"></div></section></div><section><details><summary>受控验收 · 到达、扫描、两次确认与重新开放</summary><p>下表由同一套 M3 逻辑运行受控输入生成。分母为 20 格。</p><table><thead><tr><th>步骤</th><th>已观测</th><th>剩余边界</th><th>连续确认</th><th>区域状态</th></tr></thead><tbody id="demo"></tbody></table></details></section></main><script src="viewer.js"></script></html>
