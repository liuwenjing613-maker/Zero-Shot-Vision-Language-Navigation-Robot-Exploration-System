<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP3D 岔路建点实测</title>
<style>*{box-sizing:border-box}body{margin:18px auto;padding:0 18px;max-width:1260px;font:16px/1.55 system-ui;color:#253540}h1{margin:0;font-size:26px}h2{font-size:18px}select,button{padding:5px;font:inherit}input{width:min(280px,55vw)}main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}figure{margin:0}figcaption{font-weight:650}canvas,img{width:100%}.status{background:#e8f3f1;padding:.65em}table{border-collapse:collapse}td,th{padding:4px 15px 4px 0;text-align:left;border-bottom:1px solid #c9cece}#status{font-weight:650}@media(max-width:720px){main{grid-template-columns:1fr 1fr}figure:first-child{grid-column:span 2}img{max-height:225px;object-fit:contain}}</style>
<h1>重要观察位置 · 岔路建点</h1><p>MP3D 2azQ1b91cZZ　<a href="/region-entry">查看进入新区域实测</a></p>
<label>测试位置 <select id="site"></select></label> <button id="play">从头播放</button> <button id="first">首次停稳</button> <button id="again">返回停稳</button> <input aria-label="回放帧" id="seek" type="range" min="0" value="7"> <output id="frame"></output>
<p class="status" id="status"></p><main><figure><figcaption>机器人第一视角</figcaption><img id="rgb" alt="当前机器人相机 RGB"></figure>
<figure><figcaption>当步 360° 扫描与自由空间骨架</figcaption><canvas id="map" width="640" height="640"></canvas></figure><figure><figcaption>同范围 MP3D 纹理俯视图与验收方向</figcaption><canvas id="ref" width="640" height="640"></canvas></figure></main>
<p>两张地图均宽 11.52 米。灰色为未知，白色为已知空闲，深色为障碍。细青线是骨架，橙圈是候选路口，绿线是筛选后的分支，蓝点是机器人，绿色方块是已建节点。紫色虚线来自独立导航网格验收。</p>
<h2>当前帧</h2><p id="graph"></p><p id="cand"></p><table id="branches"><thead><tr><th>分支</th><th>地图方向</th><th>骨架长度</th><th>最小通行宽度</th></tr></thead><tbody></tbody></table>
<h2>整条路线验收</h2><p id="checks"></p><a id="download" download>下载此位置的逐帧结果</a>
<script>const cases=__JUNCTION_DATA__;const $=x=>document.getElementById(x), names={T:'T 型路口',Y:'Y 型分叉',cross:'十字路口',straight:'普通直廊',bend:'L 型转弯',door:'双向门口'},actions={start:'起点',approach:'接近',leave:'离开',revisit:'返回',stop:'停止并采集新扫描',hold:'停留并再次扫描'};let timer,revision=0,url,old;
function draw(id,img,d,r,n,nearest,version){const im=new Image();im.onload=()=>{if(version!==revision)return;const g=$(id).getContext('2d'),px=p=>p.map((x,i)=>(x-d.origin[i])*640/d.span);g.imageSmoothingEnabled=id==='ref';g.drawImage(im,0,0,640,640);
function line(points,color,width,dash=[]){if(!points.length)return;g.beginPath();points.map(px).forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokeStyle=color;g.lineWidth=width;g.setLineDash(dash);g.stroke();g.setLineDash([])}
function dot(p,color,r,fill=true){let [x,y]=px(p);g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.strokeStyle=color;g.fillStyle=color;g.lineWidth=2;if(fill)g.fill();else g.stroke()}
if(id==='ref'){let c=d.fixture.center;d.fixture.headings.forEach(a=>{let angle=a*Math.PI/180;line([c,[c[0]+1.85*Math.cos(angle),c[1]+1.85*Math.sin(angle)]],'#ac2481',3,[7,5])})}else{r.candidates.forEach(q=>dot(q.xy,'#b34e18',5,false));if(nearest)nearest.branches.forEach(b=>line(b.path,'#087d50',3))}
let seen=d.trace.slice(0,n+1);line(seen.map(x=>x.xy),'#316aa7',3);for(const q of seen.filter(x=>x.node)){let [x,y]=px(q.xy);g.fillStyle='#00823c';g.fillRect(x-7,y-7,14,14)}dot(r.xy,'#134da1',4)};im.src=img}
function show(){let d=cases[$('site').value],n=Number($('seek').value),r=d.trace[n],ver=++revision;let distances=r.candidates.map(j=>Math.hypot(j.xy[0]-r.xy[0],j.xy[1]-r.xy[1]));let idx=distances.indexOf(Math.min(...distances)),q=r.candidates[idx],seen=d.trace.slice(0,n+1).filter(x=>x.node);$('seek').max=d.trace.length-1;$('rgb').src=d.images[n];$('frame').textContent=n+' / '+(d.trace.length-1);
$('status').textContent=actions[r.action]+'　|　'+(r.node?(r.node.visit_count===1?'建立 ':'再次访问 ')+r.node.place_id+' · '+r.node.branch_directions.length+' 条分支':'本帧无建点事件');
draw('map',d.maps[n],d,r,n,q,ver);draw('ref',d.reference,d,r,n,q,ver);
$('graph').textContent=seen.length?'已执行路径　P01 → '+seen[0].node.place_id+'　'+d.edges[0].path_cost.toFixed(2)+' 米　|　岔路节点已访问 '+seen.at(-1).node.visit_count+' 次':'当前拓扑图仅有起点 P01';
$('cand').textContent=q?'最近候选距机器人 '+distances[idx].toFixed(2)+' 米，下表为其分支。方向从地图 +X 轴朝 +Z 轴计量。':'当前已知网格中没有通过筛选的岔路候选。';
let tbody=$('branches').tBodies[0];tbody.replaceChildren();if(q)q.branches.forEach((b,i)=>{let row=tbody.insertRow();for(const v of [i+1,b.direction_deg.toFixed(0)+'°',b.length_m.toFixed(2)+' 米',b.min_width_m.toFixed(2)+' 米'])row.insertCell().textContent=v});
let positive=d.fixture.headings.length>=3;let events=d.trace.filter(x=>x.node);$('checks').textContent='参考可行方向 '+d.fixture.headings.length+' 个。'+(positive?'首次及返回停稳共触发 '+events.length+' 次。':'共触发 '+events.length+' 次。')+'验收'+(Object.values(d.checks).every(Boolean)?'通过。':'存在失败项。')+(d.first_missed?' 首轮曾漏检，此处显示修正后的同路线复测。':'');
if(old!==d.kind){if(url)URL.revokeObjectURL(url);let {images,maps,reference,...log}=d;url=URL.createObjectURL(new Blob([JSON.stringify(log,null,2)],{type:'application/json'}));$('download').href=url;$('download').download=d.kind+'-junction.json';old=d.kind}}
function halt(){if(timer)clearInterval(timer);timer=null;$('play').textContent='从头播放'}
Object.keys(cases).forEach(k=>$('site').add(new Option(names[k],k)));$('site').onchange=()=>{halt();$('seek').value=7;show()};$('seek').oninput=()=>{halt();show()};$('first').onclick=()=>{halt();$('seek').value=7;show()};$('again').onclick=()=>{halt();$('seek').value=21;show()};$('play').onclick=()=>{if(timer){halt();return}$('seek').value=0;show();$('play').textContent='暂停';timer=setInterval(()=>{if(+$('seek').value>=+$('seek').max){halt();return}$('seek').value=+$('seek').value+1;show()},500)};show()</script></html>
