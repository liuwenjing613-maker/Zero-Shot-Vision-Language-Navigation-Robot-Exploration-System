[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vln-perception"
version = "0.1.0"
description = "Goal parsing for zero-shot object navigation"
requires-python = ">=3.8"
dependencies = ["Pillow>=8"]

[tool.setuptools.packages.find]
where = ["src"]
